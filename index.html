<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CENTRAL JARVIS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CENTRAL JARVIS</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2e;--panel2:#11243b;--line:#203b59;--text:#edf5ff;--muted:#91a9c4;--blue:#58b4ff;--cyan:#63e0dc;--green:#65d69a;--red:#ff8585;--gold:#f3c96a;--shadow:0 12px 35px #0004}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#16365c 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit}button{cursor:pointer}main{max-width:760px;margin:auto;padding:18px 15px 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:3px 0 17px}.brand{display:flex;align-items:center;gap:11px}.orb{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#62c5ff,#2867a8);display:grid;place-items:center;color:#061321;font-weight:800;font-size:18px;box-shadow:0 0 25px #58b4ff44}.brand h1{font-size:18px;letter-spacing:.09em;margin:0}.brand p{font-size:11px;color:var(--muted);margin:0}.status{font-size:11px;color:var(--gold);border:1px solid #806b3c;border-radius:20px;padding:5px 9px;white-space:nowrap}
h2{font-size:17px;margin:0 0 9px}h3{font-size:14px;margin:0 0 7px}.muted{color:var(--muted);font-size:13px}.panel{background:linear-gradient(155deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:17px;padding:15px;margin:0 0 13px;box-shadow:var(--shadow)}.hero{padding:18px}.hero .eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.hero h2{font-size:22px;margin:4px 0}.hero p{margin:4px 0 0;color:var(--muted);font-size:13px}
.chat-shell{display:flex;flex-direction:column;gap:11px}.messages{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:2px 1px}.bubble{max-width:91%;padding:11px 13px;border-radius:15px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.jarvis{align-self:flex-start;background:#132944;border:1px solid #24496b;border-bottom-left-radius:5px}.bubble.user{align-self:flex-end;background:#174b75;border:1px solid #286b9d;border-bottom-right-radius:5px}.bubble small{display:block;color:#a9c8e6;font-size:10px;margin-top:6px}.composer{display:flex;gap:8px;align-items:flex-end}.composer textarea{flex:1;min-height:49px;max-height:130px;resize:vertical;background:#081629;color:var(--text);border:1px solid #315274;border-radius:13px;padding:12px;outline:none}.send{width:49px;height:49px;border:0;border-radius:13px;background:var(--blue);color:#061321;font-size:20px;font-weight:800}.hint{font-size:11px;color:var(--muted);margin:0}.suggestions{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #315274;background:#10243b;color:#cfe7ff;border-radius:20px;padding:7px 10px;font-size:12px}
.btn{border:0;border-radius:11px;background:var(--blue);color:#061321;font-weight:700;padding:11px 14px;min-height:43px}.btn.secondary{background:#142b44;color:var(--text);border:1px solid #315274}.btn.danger{background:#552b37;color:#ffdce2;border:1px solid #874657}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1}
.preview{border:1px solid #355b7c;background:#091a2d;border-radius:13px;padding:13px;margin-top:10px}.preview-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #1d3550;font-size:13px}.preview-row:last-child{border:0}.preview-row span:first-child{color:var(--muted)}.tag{display:inline-block;border:1px solid #41688c;border-radius:20px;padding:2px 8px;font-size:11px;color:#c5e4ff}
nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#07111fee;border-top:1px solid var(--line);backdrop-filter:blur(14px);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}nav button{flex:1;max-width:130px;background:none;border:0;color:var(--muted);font-size:10px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button b{font-size:18px;font-weight:500}nav button.active{color:var(--blue)}
.list{display:flex;flex-direction:column;gap:8px}.item{padding:11px 0;border-bottom:1px solid #1c3550}.item:last-child{border:0}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.item-title{font-weight:650}.item-meta{color:var(--muted);font-size:12px;margin-top:3px}.item button{background:none;color:var(--muted);border:0;padding:3px 6px}.empty{color:var(--muted);font-size:13px;padding:8px 0}.day{margin:0 0 12px}.day h3{color:#c5e4ff}.event{display:flex;gap:12px;padding:8px 0;border-top:1px solid #1b3550}.time{min-width:93px;color:var(--cyan);font-variant-numeric:tabular-nums}.event-name{flex:1}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#091a2d;border:1px solid #1c3957;border-radius:12px;padding:11px}.stat strong{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}
input,select{width:100%;background:#081629;color:var(--text);border:1px solid #315274;border-radius:10px;padding:11px;margin:4px 0 9px;min-height:43px}textarea:focus,input:focus,select:focus{outline:2px solid #58b4ff66}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.category{display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%}.bar{height:7px;border-radius:9px;background:#142a42;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}.note{font-size:13px;color:var(--muted);line-height:1.5}.divider{height:1px;background:#1c3550;margin:12px 0}
@media(min-width:600px){main{padding-top:25px}.messages{max-height:560px}.bubble{font-size:15px}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
(function(){
'use strict';
const TZ='America/Sao_Paulo';
const CATS=['Pessoal','Fé','Música','Estudos','Futebol','Finanças','Empreendedorismo','Objetivos','Diário','Outros'];
const COLORS={'Pessoal':'#58b4ff','Fé':'#9d8cff','Música':'#c18cff','Estudos':'#63e0dc','Futebol':'#65d69a','Finanças':'#f3c96a','Empreendedorismo':'#ffa66e','Objetivos':'#a5d98a','Diário':'#f08eb7','Outros':'#91a9c4'};
const DAYS=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
let page='chat',tasks=[],events=[],diary=[],ideas=[],messages=[],pending=null,toast='',lastReview='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:TZ}).format(new Date())}
function nowParts(){let p=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',weekday:'short',hour12:false}).formatToParts(new Date());let o={};p.forEach(x=>o[x.type]=x.value);return {date:today(),time:o.hour+':'+o.minute,wd:{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[o.weekday],hour:+o.hour}}
function plusDays(iso,n){let d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return new Intl.DateTimeFormat('sv-SE').format(d)}
function formatDate(iso){if(!iso)return 'Não definida';let [y,m,d]=iso.split('-');return d+'/'+m+'/'+y}
function persist(){localStorage.setItem('jarvis_v2',JSON.stringify({tasks,events,diary,ideas,messages,lastReview}))}
function load(){try{let x=JSON.parse(localStorage.getItem('jarvis_v2')||'{}');tasks=x.tasks||[];events=x.events||[];diary=x.diary||[];ideas=x.ideas||[];messages=x.messages||[];lastReview=x.lastReview||''}catch(e){}
 // Importa tarefas antigas do CENTRAL JARVIS sem apagar os dados originais.
 try{if(!localStorage.getItem('jarvis_v2_imported')){let old=JSON.parse(localStorage.getItem('cj_tasks')||'[]');old.forEach(t=>{if(!tasks.some(n=>n.id===t.id))tasks.push({...t,source:'importado'})});localStorage.setItem('jarvis_v2_imported','1');persist()}}catch(e){}
 if(!messages.length)messages.push({role:'jarvis',text:'Central JARVIS iniciada. Conte o que aconteceu, o que você precisa fazer ou o que deseja organizar. Vou identificar o assunto e preparar um registro. Se faltar informação importante, vou perguntar antes de salvar.'});
}
function routine(w){let a=[['14:00','15:00','Treino musical']];if(w===1||w===4)a.push(['19:30','21:30','Cursos']);if(w===3)a.push(['20:00','','Célula Uma Nova História']);if(w===6)a.push(['08:00','','Ajudar Dona Elza']);if(w===0)a.push(['09:30','','Culto'],['17:00','','Culto'],['19:30','','Culto']);return a.sort((x,y)=>x[0].localeCompare(y[0]))}
function inferCategory(s){let t=s.toLowerCase();let rules=[
['Música',/teclado|piano|m[uú]sica|cifra|acorde|louvor|cantar|ensaio|instrumento/],
['Fé',/deus|jesus|b[ií]blia|igreja|culto|ora[cç][aã]o|c[eé]lula|vers[ií]culo|pecado|adora[cç][aã]o/],
['Futebol',/atl[eé]tico|galo|futebol|cruzeiro|jogo|partida|campeonato/],
['Finanças',/dinheiro|finan[cç]as|invest|econom|poup|or[cç]amento|mercado financeiro/],
['Empreendedorismo',/empresa|neg[oó]cio|venda|marketing|cliente|marmitex|instagram|afiliad|produto|projeto/],
['Estudos',/estudar|estudo|escola|prova|mat[eé]ria|curso|aula|trabalho escolar/],
['Objetivos',/meta|objetivo|quero conseguir|pretendo|plano|planejo/],
['Pessoal',/fam[ií]lia|m[aã]e|pai|casa|amigo|cachorro|cansa[cç]o|sentindo|aconteceu comigo/],
['Diário',/hoje eu|me senti|fiquei|estou feliz|estou triste|foi um dia|aprendi que|percebi que/]
];for(let [c,r] of rules)if(r.test(t))return c;return 'Outros'}
function inferType(s){let t=s.toLowerCase();
 if(/me lembra|lembre-me|não posso esquecer|nao posso esquecer|lembrar de/.test(t))return 'Lembrete';
 if(/minha ideia|tive uma ideia|ideia:|poderia criar|e se eu|seria interessante/.test(t))return 'Ideia';
 if(/tenho consulta|reuni[aã]o|encontro|compromisso|vou ao|vou à|estarei|est[aá] marcado|agendado|culto|c[eé]lula|aula presencial/.test(t))return 'Compromisso';
 if(/preciso|tenho que|devo |fazer |entregar |terminar |concluir |resolver |comprar |estudar |praticar |ligar para|enviar /.test(t))return 'Tarefa';
 if(/hoje eu|me senti|fiquei|estou feliz|estou triste|foi um dia|aprendi que|percebi que|aconteceu/.test(t))return 'Registro pessoal';
 return '';
}
function inferDate(s){let t=s.toLowerCase(),n=nowParts(),d='';
 if(/depois de amanh[aã]/.test(t))d=plusDays(n.date,2);else if(/amanh[aã]/.test(t))d=plusDays(n.date,1);else if(/\bhoje\b/.test(t))d=n.date;
 if(!d){let m=t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);if(m){let y=m[3]?+m[3]:(+m[2]<nMonthDay().m||(+m[2]===nMonthDay().m&&+m[1]<nMonthDay().d)?new Date().getFullYear()+1:new Date().getFullYear());if(y<100)y+=2000;d=y+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0')}}
 if(!d){let weekday=[['domingo',0],['segunda',1],['terça',2],['terca',2],['quarta',3],['quinta',4],['sexta',5],['sábado',6],['sabado',6]].find(x=>new RegExp('\\b'+x[0]+'-feira\\b|\\b'+x[0]+'\\b').test(t));if(weekday){let delta=(weekday[1]-n.wd+7)%7;if(delta===0)delta=7;d=plusDays(n.date,delta)}}
 return d}
function nMonthDay(){let p=today().split('-');return {m:+p[1],d:+p[2]}}
function inferTime(s){let t=s.toLowerCase();let m=t.match(/\b(?:às|as|por volta das|por volta de|pelas?)\s*(\d{1,2})(?:h|:)(\d{2})?\b/);if(!m)m=t.match(/\b(\d{1,2})h(\d{2})?\b/);if(!m)return '';let h=+m[1],mi=+(m[2]||0);if(h>23||mi>59)return '';return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')}
function cleanTitle(s){return s.replace(/^(jarvis[, ]*)/i,'').replace(/\b(hoje|amanh[ãa]|depois de amanh[ãa])\b/ig,'').replace(/\b(às|as)\s*\d{1,2}(?::\d{2}|h\d{0,2})?\b/ig,'').replace(/[,.!?]+$/,'').trim().slice(0,130)||s.slice(0,130)}
function analyze(s){let type=inferType(s),cat=inferCategory(s),date=inferDate(s),time=inferTime(s),title=cleanTitle(s);
 if(!type){return {question:'Como você quer que eu registre isso: como tarefa, compromisso, lembrete, ideia ou registro pessoal?',choices:['Tarefa','Compromisso','Lembrete','Ideia','Registro pessoal'],source:s,cat,date,time,title}}
 if(type==='Compromisso'&&!date)return {question:'Entendi que é um compromisso. Em qual dia ele acontecerá?',choices:[],source:s,type,cat,time,title,need:'date'};
 if(type==='Compromisso'&&!time)return {question:'Qual é o horário desse compromisso? Se ainda não souber, posso registrar sem horário.',choices:['Ainda não sei'],source:s,type,cat,date,title,need:'time'};
 if(type==='Tarefa'&&!date&&/\b(hoje|amanh[ãa]|segunda|terça|quarta|quinta|sexta|sábado|domingo)\b/i.test(s)===false){/* prazo opcional */}
 return {type,cat,date,time,title,source:s,question:''}}
function addMessage(role,text,meta){messages.push({role,text,meta:meta||null,at:Date.now()});if(messages.length>80)messages=messages.slice(-80);persist()}
function reply(text){addMessage('jarvis',text);render()}
function makePreview(p){pending=p;let detail='';if(p.type)detail+='<div class="preview-row"><span>Tipo</span><b>'+esc(p.type)+'</b></div>';detail+='<div class="preview-row"><span>Tema</span><b>'+esc(p.cat||'A definir')+'</b></div>';if(p.date)detail+='<div class="preview-row"><span>Data</span><b>'+formatDate(p.date)+'</b></div>';if(p.time)detail+='<div class="preview-row"><span>Horário</span><b>'+p.time+'</b></div>';detail+='<div class="preview-row"><span>Assunto</span><b>'+esc(p.title)+'</b></div>';
 addMessage('jarvis','Preparei esta organização. Confira os dados antes de salvar.',{preview:true});
 messages[messages.length-1].html='<div class="preview">'+detail+'<div class="actions"><button class="btn" data-act="confirm">Confirmar e salvar</button><button class="btn secondary" data-act="edit">Corrigir</button><button class="btn secondary" data-act="discard">Cancelar</button></div></div>';
 persist();render()}
function savePending(){if(!pending)return;let p=pending,record={id:'j'+Date.now(),title:p.title,cat:p.cat,type:p.type,date:p.date||'',time:p.time||'',text:p.source,created:new Date().toISOString(),done:false};
 if(p.type==='Tarefa'||p.type==='Lembrete')tasks.push({...record,due:record.date,prio:'normal'});
 else if(p.type==='Compromisso')events.push(record);
 else if(p.type==='Ideia')ideas.push(record);
 else diary.push({...record,date:record.date||today()});
 pending=null;persist();addMessage('jarvis','Registro salvo em '+destination(record.type)+'. Você pode consultá-lo ou pedir uma correção aqui no chat.');render()}
function destination(t){return t==='Tarefa'?'Tarefas':t==='Lembrete'?'Lembretes':t==='Compromisso'?'Agenda':t==='Ideia'?'Ideias':'Diário'}
function processText(s){let p=analyze(s);if(p.choices&&p.choices.length){pending=p;addMessage('jarvis',p.question);messages[messages.length-1].choices=p.choices;persist();render();return}
 if(p.question){pending=p;addMessage('jarvis',p.question);if(p.choices)messages[messages.length-1].choices=p.choices;persist();render();return}
 makePreview(p)}
function handleChoice(v){if(!pending)return;let p=pending;
 if(p.need==='date'){if(v==='Ainda não sei'){p.date=''}else{let fake=inferDate(v);if(!fake){reply('Não consegui identificar a data. Escreva, por exemplo, 25/11 ou amanhã.');return}p.date=fake}p.need=p.type==='Compromisso'&&!p.time?'time':'';if(p.need){reply('Qual é o horário? Se ainda não souber, diga “ainda não sei”.');return}makePreview(p);return}
 if(p.need==='time'){p.time=v==='Ainda não sei'?'':(inferTime(v)||v);p.need='';makePreview(p);return}
 if(p.choices&& !p.type){p.type=v;p.choices=null;p.question='';if(v==='Compromisso'&&!p.date){p.need='date';reply('Qual é a data desse compromisso?');return}if(v==='Compromisso'&&!p.time){p.need='time';reply('Qual é o horário? Se não souber, diga “ainda não sei”.');return}makePreview(p);return}
 makePreview(p)}
function renderChat(){let c=nowParts();let out='<div class="hero panel"><div class="eyebrow">Assistente pessoal</div><h2>Central JARVIS</h2><p>'+DAYS[c.wd]+' · '+formatDate(c.date)+' · '+c.time+' · Belo Horizonte</p><p>Converse normalmente. O sistema prepara registros estruturados e pede confirmação antes de salvar.</p></div><div class="panel chat-shell"><div class="messages" id="messages">';
 messages.forEach((m,i)=>{out+='<div class="bubble '+(m.role==='user'?'user':'jarvis')+'">'+esc(m.text)+(m.html||'')+(m.choices?'<div class="actions">'+m.choices.map(v=>'<button class="chip" data-choice="'+esc(v)+'">'+esc(v)+'</button>').join('')+'</div>':'')+'</div>'});out+='</div><div class="composer"><textarea id="chatInput" rows="1" placeholder="Ex.: Tenho que estudar teclado amanhã às 16h"></textarea><button class="send" data-act="send" aria-label="Enviar">↑</button></div><p class="hint">Seja natural. Ex.: “Tive uma ideia para meu projeto” ou “Tenho um compromisso sexta às 15h”.</p><div class="suggestions"><button class="chip" data-fill="Preciso estudar teclado amanhã às 16h">Nova tarefa</button><button class="chip" data-fill="Tenho um compromisso sexta às 15h">Compromisso</button><button class="chip" data-fill="Tive uma ideia para um projeto">Ideia</button></div></div>';
 out+='<div class="panel"><h3>Como a organização funciona</h3><p class="note">Tema, tipo, data e horário são extraídos quando reconhecidos. Se a informação essencial estiver ausente, o JARVIS pergunta. Nada é salvo sem sua confirmação.</p><p class="note"><b>Transparência:</b> esta versão funciona localmente e sem cobrança, mas ainda não contém um modelo de linguagem avançado. A interpretação atual usa regras em português; não equivale à compreensão livre de uma IA como o ChatGPT.</p></div>';return out}
function renderAgenda(){let c=nowParts(),h='<h2>Agenda</h2><p class="muted">Rotina fixa e compromissos que você registrou pelo chat.</p>';for(let i=0;i<14;i++){let d=plusDays(c.date,i),dt=new Date(d+'T12:00:00'),w=dt.getDay(),ev=events.filter(x=>x.date===d).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));h+='<div class="panel day"><h3>'+DAYS[w]+' · '+formatDate(d)+(i===0?' · Hoje':i===1?' · Amanhã':'')+'</h3>';routine(w).forEach(x=>h+='<div class="event"><span class="time">'+x[0]+(x[1]?'–'+x[1]:'')+'</span><span class="event-name">'+x[2]+'</span><span class="tag">Fixo</span></div>');ev.forEach(x=>h+='<div class="event"><span class="time">'+(x.time||'Sem horário')+'</span><span class="event-name">'+esc(x.title)+'<div class="item-meta">'+esc(x.cat)+'</div></span><button data-act="delete" data-kind="event" data-id="'+x.id+'">Excluir</button></div>');if(!routine(w).length&&!ev.length)h+='<p class="empty">Sem compromissos registrados.</p>';h+='</div>'}return h}
function renderTasks(){let open=tasks.filter(x=>!x.done),done=tasks.filter(x=>x.done);return '<h2>Tarefas e lembretes</h2><p class="muted">Adicione pelo chat; marque como concluído quando terminar.</p><div class="panel"><div class="statgrid"><div class="stat"><strong>'+open.length+'</strong><span>Em aberto</span></div><div class="stat"><strong>'+done.length+'</strong><span>Concluídas</span></div><div class="stat"><strong>'+tasks.filter(x=>x.due===today()&&!x.done).length+'</strong><span>Para hoje</span></div></div></div><div class="panel"><h3>Em aberto</h3>'+ (open.length?open.map(x=>'<div class="item"><div class="item-head"><div><div class="item-title">'+esc(x.title)+'</div><div class="item-meta">'+esc(x.type||'Tarefa')+' · '+esc(x.cat)+' · '+(x.due?formatDate(x.due):'Sem prazo')+'</div></div><button data-act="done" data-id="'+x.id+'">Concluir</button></div></div>').join(''):'<p class="empty">Nenhuma tarefa pendente.</p>')+'</div><div class="panel"><h3>Concluídas</h3>'+(done.length?done.map(x=>'<div class="item"><div class="item-title"><s>'+esc(x.title)+'</s></div><div class="item-meta">'+esc(x.cat)+'</div></div>').join(''):'<p class="empty">Ainda não há tarefas concluídas.</p>')+'</div>'}
function renderBrain(){let all=[...tasks,...events,...ideas,...diary],counts={};CATS.forEach(c=>counts[c]=all.filter(x=>x.cat===c).length);let total=all.length;return '<h2>Cérebro</h2><p class="muted">Visão dos assuntos identificados nos seus registros.</p><div class="panel"><div class="statgrid"><div class="stat"><strong>'+total+'</strong><span>Registros</span></div><div class="stat"><strong>'+events.length+'</strong><span>Compromissos</span></div><div class="stat"><strong>'+ideas.length+'</strong><span>Ideias</span></div></div></div><div class="panel">'+CATS.map(c=>'<div class="item"><div class="category"><span class="dot" style="background:'+COLORS[c]+'"></span><b>'+c+'</b><span style="margin-left:auto">'+counts[c]+'</span></div><div class="bar"><i style="width:'+(total?counts[c]/total*100:0)+'%;background:'+COLORS[c]+'"></i></div></div>').join('')+'</div><div class="panel"><h3>Ideias</h3>'+(ideas.length?ideas.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><div class="item-meta">'+esc(x.cat)+' · '+formatDate(x.created.slice(0,10))+'</div></div>').join(''):'<p class="empty">Quando você compartilhar uma ideia pelo chat, ela aparecerá aqui.</p>')+'</div>'}
function renderDiary(){let sorted=[...diary].sort((a,b)=>(b.date||'').localeCompare(a.date||''));return '<h2>Diário</h2><p class="muted">Registros pessoais e aprendizados organizados por data.</p><div class="panel"><h3>Fechamento do dia</h3><p class="note">Às 22h, ao abrir o aplicativo, o JARVIS pode preparar uma revisão com os registros do dia. Esta versão não envia notificações automáticas em segundo plano.</p><button class="btn secondary" data-act="review">Preparar revisão de hoje</button></div><div class="panel"><h3>Registros</h3>'+(sorted.length?sorted.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><div class="item-meta">'+formatDate(x.date)+' · '+esc(x.cat)+'</div><p class="note">'+esc(x.text)+'</p></div>').join(''):'<p class="empty">Seu diário ainda está vazio. Conte algo pessoal pelo chat para começar.</p>')+'</div>'}
function renderSettings(){return '<h2>Dados e privacidade</h2><div class="panel"><h3>Armazenamento</h3><p class="note">Os registros desta versão ficam no armazenamento local deste navegador/aparelho. Eles não são enviados automaticamente ao GitHub nem sincronizados com o Obsidian.</p><div class="actions"><button class="btn" data-act="export">Exportar backup JSON</button><button class="btn secondary" data-act="clearChat">Limpar conversa</button></div></div><div class="panel"><h3>Estado da inteligência</h3><p class="note">Modo atual: interpretação local por regras. Não usa API paga, não exige chave e não envia suas mensagens a serviços externos. Para ter compreensão conversacional real de um modelo de linguagem sem pagar, será necessário integrar um modelo aberto executado no próprio dispositivo ou encontrar um serviço gratuito compatível. Isso não está ativo nesta versão.</p></div><div class="panel"><h3>Importação do projeto anterior</h3><p class="note">Na primeira abertura, tarefas antigas salvas neste navegador são copiadas para a nova estrutura. O armazenamento antigo não é apagado.</p></div>'}
function render(){let c=nowParts(),body=page==='chat'?renderChat():page==='agenda'?renderAgenda():page==='tarefas'?renderTasks():page==='cerebro'?renderBrain():page==='diario'?renderDiary():renderSettings();$('app').innerHTML='<div class="top"><div class="brand"><div class="orb">J</div><div><h1>CENTRAL JARVIS</h1><p>Organização pessoal inteligente</p></div></div><span class="status">GRATUITO · LOCAL</span></div>'+body;$('nav').innerHTML=[['chat','◉','Chat'],['agenda','▦','Agenda'],['tarefas','✓','Tarefas'],['cerebro','✧','Cérebro'],['diario','▤','Diário'],['config','⚙','Dados']].map(x=>'<button data-page="'+x[0]+'" class="'+(page===x[0]?'active':'')+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join('');let m=$('messages');if(m)m.scrollTop=m.scrollHeight}
function send(){let el=$('chatInput'),s=(el?.value||'').trim();if(!s)return;addMessage('user',s);el.value='';if(pending&&pending.need){handleChoice(s);return}processText(s)}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}let fill=e.target.closest('[data-fill]');if(fill){$('chatInput').value=fill.dataset.fill;$('chatInput').focus();return}let ch=e.target.closest('[data-choice]');if(ch){addMessage('user',ch.dataset.choice);handleChoice(ch.dataset.choice);return}let a=e.target.closest('[data-act]');if(!a)return;let act=a.dataset.act;
 if(act==='send')send();
 if(act==='confirm')savePending();
 if(act==='discard'){pending=null;addMessage('jarvis','Certo. Não salvei esse registro.');render()}
 if(act==='edit'){let t=pending?.source||'';pending=null;addMessage('jarvis','Envie a informação corrigida pelo campo de conversa.');render();$('chatInput').value=t;$('chatInput').focus()}
 if(act==='done'){tasks=tasks.map(x=>x.id===a.dataset.id?{...x,done:true}:x);persist();render()}
 if(act==='delete'){if(a.dataset.kind==='event')events=events.filter(x=>x.id!==a.dataset.id);persist();render()}
 if(act==='review'){let todays=diary.filter(x=>x.date===today());let t='Revisão de '+formatDate(today())+': '+todays.length+' registro(s) no diário.';if(todays.length)t+='\n'+todays.map(x=>'• '+x.title).join('\n');addMessage('jarvis',t);lastReview=today();persist();page='chat';render()}
 if(act==='export'){let blob=new Blob([JSON.stringify({tasks,events,diary,ideas,messages},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='central-jarvis-backup.json';link.click();URL.revokeObjectURL(url)}
 if(act==='clearChat'){if(confirm('Limpar somente o histórico da conversa? Seus registros serão preservados.')){messages=[];addMessage('jarvis','Histórico da conversa limpo. Seus registros continuam preservados.');render()}}
});
document.addEventListener('keydown',e=>{if(e.target.id==='chatInput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
load();render();
})();
</script>
