<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061326">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>CENTRAL JARVIS</title>
<style>
html{background:#061326}
:root{--bg:#061326;--card:#0d2340;--line:#28547c;--text:#f2f8ff;--mut:#a9bfd8;--blue:#45b5ff;--cyan:#62f0e2;--red:#ff8fa3;--green:#65e6a6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% -10%,#1b4e82 0,transparent 55%),#061326;color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button,input,textarea{font:inherit}button{cursor:pointer}
#err{display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#5a1020;color:#fff;font-size:12px;padding:10px 12px;white-space:pre-wrap}
.app{height:100vh;height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px 0}
header{flex:0 0 60px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #ffffff14}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.orb{width:34px;height:34px;flex:0 0 34px;border-radius:12px;background:linear-gradient(145deg,#9be4ff,#269bff);display:grid;place-items:center;color:#061321;font-weight:900;animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 12px #58b4ff44}50%{box-shadow:0 0 26px #62f0e299}}
.brand b{display:block;font-size:14px;letter-spacing:.12em}.brand small{display:block;color:var(--mut);font-size:10px;white-space:nowrap}
.chip{border:1px solid #3b7098;background:#123657;color:#f4fbff;border-radius:18px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.views{flex:1;min-height:0;position:relative}
.view{display:none;height:100%;flex-direction:column}.view.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 2px 16px}
.msgs{display:flex;flex-direction:column;gap:11px}
.m{max-width:92%;padding:10px 13px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.m.j{align-self:flex-start;background:#112c4a;border:1px solid #2b5277;border-left:2px solid var(--cyan);border-bottom-left-radius:4px}
.m.u{align-self:flex-end;background:#145a91;border:1px solid #3199d9;border-bottom-right-radius:4px}
.m time{display:block;font-size:10px;color:#9ab5d0;margin-top:4px}
.typing{display:flex;gap:5px;padding:14px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:bl 1.1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.2}40%{opacity:1}}
.prev{margin-top:9px;padding:10px;background:#08182a;border:1px solid #315779;border-radius:11px;font-size:12px}
.prev div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.prev span{color:var(--mut)}
.acts{display:flex;gap:8px;margin-top:9px}
.btn{border:0;border-radius:10px;padding:9px 13px;min-height:38px;font-weight:650;font-size:12px;background:#172d45;border:1px solid #34516d;color:var(--text)}
.btn.p{background:var(--blue);color:#061321;border-color:var(--blue);flex:1}
.quick{display:flex;gap:7px;overflow-x:auto;padding:8px 1px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}
.quick button{flex:0 0 auto;background:#0a1c30;color:#bfe9ff;border:1px solid #2f5f80;border-radius:16px;padding:6px 11px;font-size:12px}
.quick button.on{border-color:var(--cyan);color:var(--cyan)}
.comp{display:flex;align-items:flex-end;gap:8px;background:#0b1a2c;border:1px solid #294762;border-radius:17px;padding:7px;margin-bottom:8px}
textarea{flex:1;min-width:0;max-height:120px;min-height:40px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:9px 8px;font-size:16px}
.sq{height:40px;width:40px;flex:0 0 40px;border:0;border-radius:12px;background:var(--blue);color:#07111f;font-size:20px;font-weight:800}
.sq.mic{display:none;background:#12304d;color:#9fe9ff;border:1px solid #2f5f80;font-size:16px}.sq.mic.on{background:var(--red);animation:bl 1s infinite}
h2{font-size:20px;margin:2px 0 4px}.sub{font-size:12px;color:var(--mut);margin:0 0 12px}
.card{background:linear-gradient(145deg,#12243a,#16293f);border:1px solid #2b4561;border-radius:15px;padding:13px;margin:0 0 10px}
.card h3{font-size:14px;margin:0 0 6px}.row{padding:7px 0;border-bottom:1px solid #1b344d;font-size:13px}.row:last-child{border:0}.meta{font-size:11px;color:var(--mut)}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.pill{border:1px solid #284864;border-radius:20px;padding:4px 10px;font-size:11px;color:#c7def3}
.form{display:flex;gap:7px;margin-bottom:12px}.form input{min-width:0;background:#071525;border:1px solid #31516f;border-radius:10px;color:var(--text);padding:10px;font-size:16px;outline:0}
.bar{display:grid;grid-template-columns:110px 1fr 26px;gap:8px;align-items:center;font-size:12px;margin:6px 0}.bar em{height:9px;background:#0a1c30;border-radius:6px;overflow:hidden;display:block}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}.bar b{text-align:right}
.done{opacity:.5;text-decoration:line-through}
nav{flex:0 0 auto;display:flex;border-top:1px solid #ffffff17;margin:0 -14px;padding:4px 4px calc(4px + env(safe-area-inset-bottom));background:#081321}
nav button{flex:1;height:48px;border:0;border-radius:12px;background:transparent;color:#8197af;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
nav button span{font-size:17px}nav button.on{color:#8bd2ff;background:#16365088}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<div id="err"></div>
<script>window.onerror=function(m,u,l){var e=document.getElementById('err');if(e){e.style.display='block';e.textContent='Erro no aplicativo: '+m+' (linha '+l+')'}};</script>
<div class="app">
<header>
 <div class="brand"><div class="orb">J</div><div><b>CENTRAL JARVIS</b><small id="hud">ASSISTENTE PESSOAL</small></div></div>
 <button class="chip" id="wchip" type="button">--°</button>
</header>
<div class="views">
 <section class="view on" id="v-chat">
  <div class="scroll" id="scroll"><div class="msgs" id="msgs"></div></div>
  <div class="quick" id="quick"></div>
  <div class="comp"><textarea id="inp" rows="1" placeholder="Escreva sua mensagem..." aria-label="Mensagem"></textarea><button class="sq mic" id="mic" type="button" aria-label="Falar">🎙</button><button class="sq" id="send" type="button" aria-label="Enviar">↑</button></div>
 </section>
 <section class="view" id="v-agenda"><div class="scroll" id="agenda"></div></section>
 <section class="view" id="v-tarefas"><div class="scroll" id="tarefas"></div></section>
 <section class="view" id="v-painel"><div class="scroll" id="painel"></div></section>
</div>
<nav id="nav"></nav>
</div>
<script>
(function(){
'use strict';
var TZ='America/Sao_Paulo',KEY='jarvis_v3_local',LAT=-19.827,LON=-43.936;
var DAYS=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var D={records:[],messages:[]},pending=null,typing=false,speakOn=false,rec=null,W=null,view='chat';
try{var raw=localStorage.getItem(KEY);if(raw){D=JSON.parse(raw)||D}speakOn=localStorage.getItem('jarvis_voice')==='1'}catch(e){}
if(!Array.isArray(D.records))D.records=[];if(!Array.isArray(D.messages))D.messages=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function tz(o,d){return new Intl.DateTimeFormat('pt-BR',Object.assign({timeZone:TZ},o)).format(d||new Date())}
function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:TZ}).format(new Date())}
function timeNow(){return tz({hour:'2-digit',minute:'2-digit',hour12:false})}
function longDate(){return tz({weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function plus(iso,n){var d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return new Intl.DateTimeFormat('sv-SE').format(d)}
function fmt(iso){if(!iso)return 'sem data';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function dow(iso){return new Date(iso+'T12:00:00').getDay()}
function greet(){var h=parseInt(tz({hour:'2-digit',hour12:false}),10)%24;return h<5?'Boa noite':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}
function isTask(r){return r.type==='Tarefa'||r.type==='Lembrete'}
function fixed(iso){var w=dow(iso),f=[['14:00','Treino musical']];if(w===1||w===4)f.push(['19:30','Cursos (até 21:30)']);if(w===3)f.push(['20:00','Célula Uma Nova História']);if(w===6)f.push(['08:00','Ajudar Dona Elza']);if(w===0)f.push(['09:30','Culto'],['17:00','Culto'],['19:30','Culto']);return f}
function dayItems(iso){return fixed(iso).concat(D.records.filter(function(r){return r.type==='Compromisso'&&r.date===iso}).map(function(r){return[r.time||'--:--',r.title]})).sort(function(a,b){return a[0].localeCompare(b[0])})}
function dayText(iso,label){var tk=D.records.filter(function(r){return isTask(r)&&!r.done&&r.date===iso});return '▸ '+label+' — '+DAYS[dow(iso)]+', '+fmt(iso)+'\n'+dayItems(iso).map(function(x){return x[0]+' · '+x[1]}).join('\n')+(tk.length?'\nTarefas com data: '+tk.map(function(r){return r.title}).join('; '):'')}
function tasksText(){var t=today(),a=D.records.filter(function(r){return isTask(r)&&!r.done}).sort(function(x,y){return(x.date||'9999').localeCompare(y.date||'9999')});if(!a.length)return 'Nenhuma tarefa em aberto registrada.';return '▸ TAREFAS EM ABERTO ('+a.length+')\n'+a.map(function(r){return '• '+r.title+(r.date?' — '+fmt(r.date)+(r.date<t?' (atrasada)':''):'')}).join('\n')}
function n0(v,u){return isFinite(v)&&v!==null?Math.round(v)+(u||''):'--'}
var WC={0:'céu limpo',1:'predominantemente limpo',2:'parcialmente nublado',3:'nublado',45:'neblina',48:'neblina',51:'garoa leve',53:'garoa',55:'garoa intensa',61:'chuva leve',63:'chuva moderada',65:'chuva forte',80:'pancadas leves',81:'pancadas moderadas',82:'pancadas fortes',95:'trovoada',96:'trovoada com granizo',99:'trovoada com granizo'};
function weatherText(){if(!W)return 'Clima indisponível: não consegui consultar a Open-Meteo agora.';var c=W.current||{},h=W.hourly||{},d=W.daily||{},pr=(h.precipitation_probability||[]).filter(isFinite),mx=pr.length?Math.max.apply(null,pr):null;var s='Agora '+n0(c.temperature_2m,'°C')+' (sensação '+n0(c.apparent_temperature,'°C')+'), '+(WC[c.weather_code]||'condição não informada')+'. Mín '+n0((d.temperature_2m_min||[])[0],'°C')+' · Máx '+n0((d.temperature_2m_max||[])[0],'°C')+'.';if(mx!==null)s+='\nChuva: probabilidade máxima de '+mx+'% hoje.';if(c.weather_code>=95)s+='\nALERTA: trovoada registrada neste momento.';else if(mx>=50)s+='\nRecomendação: leve guarda-chuva.';return s+'\nFonte: Open-Meteo.'}
function loadWeather(){var ctl=window.AbortController?new AbortController():null,to=setTimeout(function(){if(ctl)ctl.abort()},8000);var url='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+'&current=temperature_2m,apparent_temperature,weather_code&hourly=precipitation_probability&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo&forecast_days=1';return fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){if(!r.ok)throw new Error('http');return r.json()}).then(function(d){W=d;var c=d.current||{};$('wchip').textContent=n0(c.temperature_2m,'°')}).catch(function(){W=null;$('wchip').textContent='--°'}).then(function(){clearTimeout(to)})}
function notices(){var t=today(),w=dow(t),a=[];if(w===2)a.push('A célula Uma Nova História é amanhã, às 20h.');if(w===3)a.push('A célula Uma Nova História é hoje, às 20h.');if(w===5)a.push('Amanhã é dia de ajudar Dona Elza, às 8h.');if(w===6)a.push('Cultos amanhã: 9h30, 17h e 19h30.');var ov=D.records.filter(function(r){return isTask(r)&&!r.done&&r.date&&r.date<t}).length;if(ov)a.push(ov+' tarefa(s) atrasada(s).');return a.length?a.map(function(x){return '• '+x}).join('\n'):'Sem avisos para hoje.'}
function stats(){var t=today(),tk=D.records.filter(isTask),op=tk.filter(function(r){return!r.done}),ov=op.filter(function(r){return r.date&&r.date<t}),ct={};D.records.forEach(function(r){var k=r.cat||'Outros';ct[k]=(ct[k]||0)+1});var cats=Object.keys(ct).map(function(k){return[k,ct[k]]}).sort(function(a,b){return b[1]-a[1]});var nx=D.records.filter(function(r){return r.type==='Compromisso'&&r.date>=t}).sort(function(a,b){return(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))})[0];return{tk:tk,op:op,dn:tk.length-op.length,ov:ov,cats:cats,nx:nx}}
function analysis(){var s=stats();return '▸ ANÁLISE DOS SEUS DADOS\nRegistros: '+D.records.length+'\nTarefas: '+s.op.length+' em aberto, '+s.dn+' concluídas'+(s.tk.length?' ('+Math.round(s.dn/s.tk.length*100)+'%)':'')+'\nAtrasadas: '+s.ov.length+(s.cats.length?'\nTemas mais ativos: '+s.cats.slice(0,3).map(function(c){return c[0]+' ('+c[1]+')'}).join(', '):'')+(s.nx?'\nPróximo compromisso: '+s.nx.title+' — '+fmt(s.nx.date)+(s.nx.time?' às '+s.nx.time:''):'')+'\n\n▸ RECOMENDAÇÃO\n'+(s.ov.length?'Priorizar as '+s.ov.length+' tarefa(s) atrasada(s) antes de novas demandas.':s.op.length?'Sem atrasos. Priorize as tarefas com data mais próxima.':D.records.length?'Sem pendências. A base ainda é pequena para identificar tendências.':'Ainda não há registros suficientes. Registre tarefas e compromissos para gerar análises.')}
function help(){return '▸ COMANDOS\n• briefing / bom dia\n• minha agenda / agenda de amanhã\n• minhas tarefas\n• análise / prioridades\n• clima / vai chover?\n• que horas são / que dia é hoje\n• anota…, lembra-me…, agenda… (registro com confirmação)\nUso somente seus dados reais; nada é salvo sem a sua confirmação.'}
function say(t){if(!speakOn||!window.speechSynthesis)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(t).replace(/[▸•·—]/g,' ').slice(0,700));u.lang='pt-BR';speechSynthesis.speak(u)}catch(e){}}
function add(role,text,prev){D.messages.push({role:role,text:text,prev:prev||null,at:Date.now()});if(D.messages.length>80)D.messages=D.messages.slice(-80);if(role==='j')say(text);save();renderMsgs()}
function renderMsgs(){var h=D.messages.map(function(m){return '<article class="m '+(m.role==='u'?'u':'j')+'">'+esc(m.text)+(m.prev?prevHtml(m.prev):'')+'<time>'+tz({hour:'2-digit',minute:'2-digit'},new Date(m.at||Date.now()))+'</time></article>'}).join('');if(typing)h+='<article class="m j typing"><i></i><i></i><i></i></article>';$('msgs').innerHTML=h;$('scroll').scrollTop=$('scroll').scrollHeight}
function prevHtml(p){return '<div class="prev"><div><span>Tipo</span><b>'+esc(p.type)+'</b></div><div><span>Assunto</span><b>'+esc(p.title)+'</b></div>'+(p.date?'<div><span>Data</span><b>'+fmt(p.date)+'</b></div>':'')+(p.time?'<div><span>Horário</span><b>'+esc(p.time)+'</b></div>':'')+'<div class="acts"><button class="btn p" data-act="ok">Confirmar e salvar</button><button class="btn" data-act="no">Cancelar</button></div></div>'}
function inferDate(s){var t=s.toLowerCase();if(/depois de amanh[aã]/.test(t))return plus(today(),2);if(/amanh[aã]/.test(t))return plus(today(),1);if(/\bhoje\b/.test(t))return today();var m=t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);if(m){var y=m[3]?+m[3]:+today().slice(0,4);if(y<100)y+=2000;return y+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2)}var ds=[['domingo',0],['segunda',1],['terça',2],['terca',2],['quarta',3],['quinta',4],['sexta',5],['sábado',6],['sabado',6]];for(var i=0;i<ds.length;i++){if(new RegExp(ds[i][0]+'(?:-feira)?').test(t)){var dl=(ds[i][1]-dow(today())+7)%7;return plus(today(),dl||7)}}return ''}
function inferTime(s){var t=s.toLowerCase(),m=t.match(/(?:às|as|por volta das)\s*(\d{1,2})(?:h|:)(\d{2})?/)||t.match(/\b(\d{1,2})h(\d{2})?\b/);if(!m)return '';var h=+m[1],mi=+(m[2]||0);return h<24&&mi<60?('0'+h).slice(-2)+':'+('0'+mi).slice(-2):''}
var CATS=[['Fé',/deus|jesus|bíblia|igreja|culto|oração|célula/],['Música',/teclado|piano|música|cifra|acorde|ensaio|louvor/],['Futebol',/atlético|galo|futebol|jogo/],['Finanças',/dinheiro|finanças|invest|poupança|orçamento/],['Estudos',/estud|escola|prova|curso|aula|matemática|física|inglês/],['Tecnologia',/código|aplicativo|app\b|github|obsidian|programa/],['Empreendedorismo',/marmitex|instagram|afiliado|venda|cliente|negócio|marketing/]];
function cat(s){var t=s.toLowerCase();for(var i=0;i<CATS.length;i++)if(CATS[i][1].test(t))return CATS[i][0];return 'Outros'}
function parse(s){var t=s.toLowerCase(),date=inferDate(s),time=inferTime(s),type=/lembr/.test(t)?'Lembrete':(date&&time)||/reuni|consulta|compromisso|encontro|culto|c[eé]lula/.test(t)?'Compromisso':'Tarefa';var title=s.replace(/^(jarvis[, ]*)?(anota|anotar|registre|registrar|salva|salvar|guarda|guardar|cria|criar|adicione|adicionar|agendar|agenda|lembra-me|lembre-me|lembrete)[:,]?\s*/i,'').replace(/(^|\s)(hoje|amanh[ãa]|depois de amanh[ãa])(?=[\s.,!?]|$)/ig,' ').replace(/(^|\s)(às|as)\s*\d{1,2}(:\d{2}|h\d{0,2})?(?=[\s.,!?]|$)/ig,' ').replace(/\s+/g,' ').replace(/[,.!?\s]+$/,'').trim();return{type:type,date:date,time:time,title:(title||s).slice(0,120),source:s}}
function commit(p){D.records.push({id:'j'+Date.now()+Math.random().toString(36).slice(2,6),type:p.type,cat:cat(p.source||p.title),themes:[cat(p.source||p.title)],date:p.date||'',time:p.time||'',title:p.title,source:p.source||p.title,created:new Date().toISOString(),done:false});save()}
function ask(p){pending=p;if(p.type==='Compromisso'&&!p.date){p.need='date';add('j','Qual é a data desse compromisso? (ex.: 25/11, amanhã, sexta-feira)');return}p.need='';add('j','Confira o registro antes de salvar.',p)}
function think(on){typing=on;renderMsgs()}
function briefing(){think(true);loadWeather().then(function(){think(false);var t=today();add('j',greet()+', senhor Rafael.\nHoje é '+longDate()+', e são '+timeNow()+' em Belo Horizonte.\nSegue seu briefing diário.\n\n▸ CLIMA\n'+weatherText()+'\n\n'+dayText(t,'HOJE')+'\n\n'+dayText(plus(t,1),'AMANHÃ')+'\n\n▸ AVISOS\n'+notices())})}
function clima(){think(true);loadWeather().then(function(){think(false);add('j',weatherText())})}
var CREATE=/\b(anota|anotar|registre|registrar|salva|salvar|guarda|guardar|cria|criar|adicione|adicionar|agendar|lembrete|lembra-me|lembre-me)\b/i;
function intel(s){var t=s.toLowerCase().trim(),r=function(x){add('j',x);return true};
if(/^(briefing|bom dia|boa tarde|boa noite)\b/.test(t)){briefing();return true}
if(/\b(que horas|horas são|hora atual)\b/.test(t))return r('São '+timeNow()+' em Belo Horizonte.');
if(/\b(que dia|data de hoje|dia da semana|qual a data)\b/.test(t))return r('Hoje é '+longDate()+'.');
if(/\b(clima|chuva|chover|temperatura|guarda-chuva|previs[aã]o)(?![a-zà-ú])/.test(t)){clima();return true}
if(/\b(an[aá]lise|diagn[oó]stico|resumo executivo|relat[oó]rio|prioridades)\b/.test(t))return r(analysis());
if(/\b(minhas tarefas|quais tarefas|tarefas pendentes|tarefas abertas|pend[eê]ncias)\b/.test(t))return r(tasksText());
if(/(minha agenda|agenda d[eoa]|meus compromissos|compromissos d|o que (eu )?tenho|organize meu dia)/.test(t)){var h=today();if(/amanh[aã]/.test(t))return r(dayText(plus(h,1),'AMANHÃ'));return r(dayText(h,'HOJE')+'\n\n'+dayText(plus(h,1),'AMANHÃ'))}
if(/\b(ajuda|comandos|o que (você|voce) (faz|sabe))\b/.test(t))return r(help());
return false}
function send(){var el=$('inp'),s=el.value.trim();if(!s)return;el.value='';el.style.height='auto';add('u',s);
if(pending&&pending.need==='date'){if(/^(cancela|cancelar|n[ãa]o)$/i.test(s)){pending=null;add('j','Certo. Não salvei esse registro.');return}var d=inferDate(s);if(!d){add('j','Não identifiquei a data. Escreva, por exemplo, 25/11, amanhã ou sexta-feira.');return}pending.date=d;ask(pending);return}
if(pending){if(/^(sim|confirmo|confirmar|ok|salvar)$/i.test(s)){commit(pending);pending=null;add('j','Registro salvo neste aparelho.');return}if(/^(n[ãa]o|cancela|cancelar)$/i.test(s)){pending=null;add('j','Certo. Não salvei esse registro.');return}}
if(!CREATE.test(s)&&intel(s))return;
if(CREATE.test(s)||/^agenda\b/i.test(s)){ask(parse(s));return}
if(/^(ol[aá]|oi|e a[ií])[!?. ]*$/i.test(s)){add('j','Olá, senhor. Sistemas online. Digite “briefing” ou “ajuda” para ver o que posso fazer.');return}
add('j','Entendi, mas ainda não tenho um modelo de IA conectado para conversa livre. Consigo: briefing, agenda, tarefas, clima, análise e registros. Digite “ajuda” para ver os comandos.')}
function page(id,html){$(id).innerHTML=html}
function rAgenda(){var h='<h2>Agenda</h2><p class="sub">Rotina fixa e compromissos registrados — próximos 7 dias.</p>';for(var i=0;i<7;i++){var d=plus(today(),i);h+='<div class="card"><h3>'+DAYS[dow(d)]+' · '+fmt(d)+(i===0?' · Hoje':i===1?' · Amanhã':'')+'</h3>'+dayItems(d).map(function(x){return '<div class="row"><b>'+esc(x[0])+'</b> · '+esc(x[1])+'</div>'}).join('')+'</div>'}page('agenda',h)}
function rTasks(){var a=D.records.filter(isTask).sort(function(x,y){return(x.done-y.done)||(x.date||'9999').localeCompare(y.date||'9999')}),s=stats();page('tarefas','<h2>Tarefas</h2><p class="sub">Ações e lembretes registrados.</p><div class="form"><input id="tt" placeholder="Nova tarefa" style="flex:1"><input id="td" type="date"><button class="btn p" id="ta" style="flex:0 0 auto">+</button></div><div class="pills"><span class="pill">'+s.op.length+' em aberto</span><span class="pill">'+s.dn+' concluídas</span></div><div class="card">'+(a.length?a.map(function(r){return '<div class="row"><b class="'+(r.done?'done':'')+'">'+esc(r.title)+'</b><div class="meta">'+esc(r.type)+(r.date?' · '+fmt(r.date):'')+(r.time?' às '+esc(r.time):'')+'</div><div class="acts"><button class="btn" data-done="'+esc(r.id)+'">'+(r.done?'Reabrir':'Concluir')+'</button><button class="btn" data-del="'+esc(r.id)+'">Excluir</button></div></div>'}).join(''):'<div class="meta">Nenhuma tarefa registrada.</div>')+'</div>')}
function rPanel(){var s=stats(),mx=s.cats.length?s.cats[0][1]:1;page('painel','<h2>Painel</h2><p class="sub">Análise dos seus dados reais.</p><div class="pills"><span class="pill">'+D.records.length+' registros</span><span class="pill">'+s.op.length+' em aberto</span><span class="pill">'+s.dn+' concluídas</span><span class="pill">'+s.ov.length+' atrasadas</span></div><div class="card"><h3>Registros por tema</h3>'+(s.cats.length?s.cats.slice(0,8).map(function(c){return '<div class="bar"><span>'+esc(c[0])+'</span><em><i style="width:'+Math.round(c[1]/mx*100)+'%"></i></em><b>'+c[1]+'</b></div>'}).join(''):'<div class="meta">Sem dados ainda. Registre algo no chat.</div>')+'</div><div class="card"><h3>Leitura do JARVIS</h3><div class="row" style="white-space:pre-wrap">'+esc(analysis())+'</div></div>')}
function setView(v){view=v;['chat','agenda','tarefas','painel'].forEach(function(x){$('v-'+x).classList.toggle('on',x===v)});if(v==='agenda')rAgenda();if(v==='tarefas')rTasks();if(v==='painel')rPanel();nav()}
function nav(){$('nav').innerHTML=[['chat','◉','Chat'],['agenda','▦','Agenda'],['tarefas','✓','Tarefas'],['painel','✧','Painel']].map(function(x){return '<button type="button" data-nav="'+x[0]+'" class="'+(view===x[0]?'on':'')+'"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join('')}
function hud(){$('hud').textContent=tz({weekday:'short',day:'2-digit',month:'2-digit'}).replace('.','').toUpperCase()+' · '+timeNow()+' · '+(navigator.onLine?'ONLINE':'OFFLINE')}
function mic(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;if(rec){rec.stop();return}rec=new SR();rec.lang='pt-BR';rec.interimResults=false;rec.onresult=function(e){$('inp').value=e.results[0][0].transcript;send()};rec.onend=function(){rec=null;$('mic').classList.remove('on')};rec.onerror=function(){};$('mic').classList.add('on');try{rec.start()}catch(e){rec=null;$('mic').classList.remove('on')}}
document.addEventListener('click',function(e){var t=e.target,b;
if((b=t.closest('[data-nav]'))){setView(b.dataset.nav);return}
if((b=t.closest('[data-act]'))){if(!pending)return;if(b.dataset.act==='ok'){commit(pending);pending=null;add('j','Registro salvo neste aparelho.')}else{pending=null;add('j','Certo. Não salvei esse registro.')}return}
if((b=t.closest('[data-done]'))){var r=D.records.filter(function(x){return x.id===b.dataset.done})[0];if(r){r.done=!r.done;save();rTasks()}return}
if((b=t.closest('[data-del]'))){if(confirm('Excluir esta tarefa?')){D.records=D.records.filter(function(x){return x.id!==b.dataset.del});save();rTasks()}return}
if(t.id==='ta'){var v=$('tt').value.trim();if(v){commit({type:'Tarefa',title:v,source:v,date:$('td').value});rTasks()}return}
if(t.id==='wchip'){clima();setView('chat')}});
$('send').addEventListener('click',send);
$('inp').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('inp').addEventListener('input',function(e){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'});
$('quick').innerHTML=[['☀ Briefing','briefing'],['▦ Agenda','minha agenda'],['✓ Tarefas','minhas tarefas'],['☔ Clima','clima'],['✧ Análise','análise'],['? Ajuda','ajuda']].map(function(x){return '<button type="button" data-q="'+x[1]+'">'+x[0]+'</button>'}).join('')+'<button type="button" id="vb" class="'+(speakOn?'on':'')+'">'+(speakOn?'🔊 Voz ligada':'🔇 Voz')+'</button>';
$('quick').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.id==='vb'){speakOn=!speakOn;try{localStorage.setItem('jarvis_voice',speakOn?'1':'0')}catch(x){}b.textContent=speakOn?'🔊 Voz ligada':'🔇 Voz';b.classList.toggle('on',speakOn);if(!speakOn&&window.speechSynthesis)speechSynthesis.cancel();return}$('inp').value=b.dataset.q;send()});
if(window.SpeechRecognition||window.webkitSpeechRecognition){$('mic').style.display='block';$('mic').addEventListener('click',mic)}
if(!D.messages.length)D.messages.push({role:'j',text:greet()+', senhor Rafael. Sistemas online. Digite “briefing” ou “ajuda” para começar.',at:Date.now()});
nav();renderMsgs();hud();setInterval(hud,30000);loadWeather();
window.addEventListener('pagehide',save);
})();
</script>
