<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b17">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CENTRAL JARVIS</title>
<style>
:root{--bg:#050b17;--panel:#0b1730;--panel2:#0f2040;--line:#1b3a6b;--tx:#eaf2ff;--mut:#8aa6cc;--ac:#3aa0ff;--bad:#ff6b6b;--ok:#4ade80;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
background-image:radial-gradient(ellipse at 50% -10%,#0d2a57 0,transparent 55%)}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:1.35rem;margin:0 0 2px;font-weight:600;letter-spacing:.01em}
h2{font-size:1.02rem;margin:0 0 10px;font-weight:600;color:#cfe3ff}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 14px}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 0 18px rgba(58,160,255,.08)}
ul{list-style:none;margin:0;padding:0}
li.ev{display:flex;gap:12px;padding:8px 0;border-top:1px solid #14284d}
li.ev:first-child{border-top:0}
li.ev .t{min-width:96px;color:var(--ac);font-variant-numeric:tabular-nums}
li.past{opacity:.45}
li.next{background:rgba(58,160,255,.12);margin:0 -8px;padding:8px;border-radius:8px;border-top:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.num{font-size:1.9rem;font-weight:600;line-height:1}
.num.bad{color:var(--bad)}
.mut{color:var(--mut);font-size:.88rem}
.aviso{border-left:3px solid var(--ac);padding:6px 10px;margin:6px 0;background:rgba(58,160,255,.08);border-radius:0 8px 8px 0;font-size:.92rem}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(5,11,23,.94);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(8px)}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:.7rem;padding:6px 2px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button b{font-size:1.15rem;font-weight:400}
nav button.on{color:var(--ac)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select{width:100%;background:#071226;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;margin-bottom:8px;min-height:44px}
.btn{background:var(--ac);color:#03111f;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;min-height:44px;cursor:pointer;width:100%}
.seg{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.seg button{background:var(--panel);color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font:inherit;font-size:.86rem;white-space:nowrap;min-height:40px;cursor:pointer}
.seg button.on{background:var(--ac);color:#03111f;border-color:var(--ac)}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid #14284d}
.task:first-child{border-top:0}
.chk{width:30px;height:30px;min-width:30px;border-radius:50%;border:2px solid var(--ac);background:none;color:#03111f;cursor:pointer;font-size:1rem}
.chk.done{background:var(--ok);border-color:var(--ok)}
.task .tt{flex:1}
.task.isdone .tt b{text-decoration:line-through;color:var(--mut)}
.pill{display:inline-block;font-size:.74rem;padding:1px 8px;border-radius:999px;border:1px solid currentColor;margin-right:6px}
.del{background:none;border:0;color:var(--mut);cursor:pointer;min-height:40px;padding:0 6px;font:inherit;font-size:.82rem}
.del.conf{color:var(--bad)}
.wrap{overflow-x:auto}
svg text{fill:#cfe3ff;font-size:10px;font-family:inherit}
.st{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #14284d}
.st:first-child{border-top:0}
.tag{font-size:.78rem;padding:2px 9px;border-radius:999px;white-space:nowrap;height:fit-content}
.tag.impl{background:rgba(58,160,255,.18);color:#8cc8ff}
.tag.plan{background:rgba(138,166,204,.15);color:var(--mut)}
.dim{color:var(--mut)}
textarea{width:100%;background:#071226;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;margin-bottom:8px;min-height:96px;resize:vertical}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;margin:8px 0 0}
.nl{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid #14284d;color:var(--tx);font:inherit;padding:12px 0;min-height:44px;cursor:pointer}
.btn.alt{background:var(--panel);color:var(--tx);border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}

.note-list{display:flex;flex-direction:column;gap:8px}
.note-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px;background:rgba(7,18,38,.62);border:1px solid rgba(58,160,255,.13);border-radius:12px;color:var(--tx);text-align:left;cursor:pointer;min-height:64px}
.note-item:active{background:rgba(58,160,255,.12)}
.note-icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:11px;background:rgba(58,160,255,.12);color:#8cc8ff;font-size:1.05rem}
.note-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.note-title{font-size:.94rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.note-sub{font-size:.75rem;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-arrow{color:var(--mut);font-size:1.25rem}
.note-heading{margin:14px 0 4px;font-size:1.12rem;font-weight:650;line-height:1.3;color:#eaf2ff}
.note-content{line-height:1.65;overflow-wrap:anywhere}
.note-content p{margin:8px 0;color:#d7e5f8}
.note-content ul{padding-left:18px;list-style:disc}
.note-content li{padding:3px 0;color:#d7e5f8}
.note-content strong{color:#fff;font-weight:650}
.note-content code{background:#071226;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:#a9d4ff}
.note-section{background:rgba(7,18,38,.48);border:1px solid rgba(58,160,255,.12);border-radius:12px;padding:12px;margin-top:10px}
.note-check{display:flex;gap:11px;align-items:center;padding:10px 2px;border-bottom:1px solid #14284d}
.note-check:last-child{border-bottom:0}
.note-check input{width:20px;min-height:20px;margin:0;flex:0 0 20px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var TZ='America/Sao_Paulo';
var CATS={'Pessoal':'#3aa0ff','Música':'#b366ff','Fé':'#7c6cff','Estudos':'#22d3ee','Futebol':'#22c55e','Finanças':'#facc15','Empreendedorismo':'#fb923c','Objetivos':'#86efac','Diário':'#f472b6'};
var DIA=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
var tab='inicio',view='hoje',selCat=null,delId=null,tasks=[],mem=null,cfg={owner:'rafasouzz00',repo:'central-jarvis-vault',token:''},notes=null,noteView=null,vmsg='',loading=false,draft='',review=false,wmsg='',classifyChoice='',classifyReview=false,classifyMsg='',classifyBusy=false,relatedSelection=[],relatedReview=false,relatedMsg='',relatedBusy=false,suggestedRelated=[],suggestBusy=false,noteTitles={};

function load(){try{var r=localStorage.getItem('cj_tasks');tasks=r?JSON.parse(r):[]}catch(e){tasks=mem||[]}}
function save(){try{localStorage.setItem('cj_tasks',JSON.stringify(tasks))}catch(e){mem=tasks}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(o,d){return new Intl.DateTimeFormat('pt-BR',Object.assign({timeZone:TZ},o)).format(d)}
function isoOf(d){return new Intl.DateTimeFormat('sv-SE',{timeZone:TZ}).format(d)}
function wdOf(d){return {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short'}).format(d)]}
function clock(){var d=new Date(),t=new Date(d.getTime()+864e5);
 var hm=fmt({hour:'2-digit',minute:'2-digit',hour12:false},d).split(':');
 return{wd:wdOf(d),iso:isoOf(d),time:hm.join(':'),h:+hm[0],min:+hm[0]*60+ +hm[1],long:fmt({weekday:'long',day:'numeric',month:'long',year:'numeric'},d),twd:wdOf(t),tiso:isoOf(t)}}
function toMin(s){var p=s.split(':');return +p[0]*60+ +p[1]}
function fixed(w){var e=[['14:00','15:00','Treino musical']];
 if(w==1||w==4)e.push(['19:30','21:30','Curso de inteligência artificial']);
 if(w==3)e.push(['20:00',null,'Célula Uma Nova História']);
 if(w==6)e.push(['08:00',null,'Ajudar Dona Elza']);
 if(w==0)e.push(['09:30',null,'Culto'],['17:00',null,'Culto'],['19:30',null,'Culto']);
 return e.sort(function(a,b){return a[0]<b[0]?-1:1})}
function evHTML(w,today,nm){var first=true;return fixed(w).map(function(x){
 var m=toMin(x[0]),end=x[1]?toMin(x[1]):m+60,cls='';
 if(today&&nm>=end)cls=' past';else if(today&&first){cls=' next';first=false}
 return '<li class="ev'+cls+'"><span class="t">'+x[0]+(x[1]?'–'+x[1]:'')+'</span><span>'+x[2]+'</span></li>'}).join('')}
function stat(t,c){if(t.done)return'done';if(t.due&&t.due<c.iso)return'late';if(t.due===c.iso)return'today';return'open'}
function filt(c){return tasks.filter(function(t){var s=stat(t,c);
 return view=='atrasadas'?s=='late':view=='hoje'?s=='today':view=='concluidas'?s=='done':true})}
function taskHTML(t,c){var s=stat(t,c);
 return '<div class="task'+(t.done?' isdone':'')+'"><button class="chk'+(t.done?' done':'')+'" data-a="tog" data-id="'+t.id+'" aria-label="Alternar conclusão">'+(t.done?'✓':'')+'</button>'
 +'<div class="tt"><b>'+esc(t.title)+'</b><div class="mut"><span class="pill" style="color:'+(CATS[t.cat]||'#3aa0ff')+'">'+esc(t.cat)+'</span>'
 +(t.due?'<span'+(s=='late'?' style="color:var(--bad)"':'')+'>'+t.due.split('-').reverse().join('/')+(s=='late'?' · atrasada':'')+'</span>':'sem prazo')+(t.prio=='alta'?' · prioridade alta':'')+'</div></div>'
 +'<button class="del'+(delId===t.id?' conf':'')+'" data-a="del" data-id="'+t.id+'">'+(delId===t.id?'Confirmar':'Excluir')+'</button></div>'}

function vInicio(c){
 var gr=c.h<12?'Bom dia':c.h<18?'Boa tarde':'Boa noite';
 var late=tasks.filter(function(t){return stat(t,c)=='late'}).length,td=tasks.filter(function(t){return stat(t,c)=='today'}).length;
 var av=fixed(c.twd).filter(function(x){return x[2]!='Treino musical'}).map(function(x){return '<div class="aviso">Amanhã: '+x[2]+' às '+x[0]+'.</div>'}).join('');
 return '<h1>'+gr+', senhor Rafael.</h1><p class="sub">'+c.long+' · '+c.time+' em Belo Horizonte</p>'
 +'<div class="row"><div class="card"><div class="num'+(late?' bad':'')+'">'+late+'</div><div class="mut">tarefas atrasadas</div></div>'
 +'<div class="card"><div class="num">'+td+'</div><div class="mut">pendentes hoje</div></div></div>'
 +'<div class="card"><h2>Hoje · '+DIA[c.wd]+'</h2><ul>'+evHTML(c.wd,true,c.min)+'</ul></div>'
 +'<div class="card"><h2>Amanhã · '+DIA[c.twd]+'</h2><ul>'+evHTML(c.twd,false,0)+'</ul>'+av+'</div>'}

function vAgenda(c){var h='<h1>Agenda</h1><p class="sub">Rotina fixa. Só você altera estes compromissos.</p>';
 for(var i=0;i<7;i++){var w=(c.wd+i)%7;h+='<div class="card"><h2>'+DIA[w]+(i==0?' · hoje':'')+'</h2><ul>'+evHTML(w,false,0)+'</ul>'+((w==2||w==5)?'<div class="mut">Sem outros compromissos fixos.</div>':'')+'</div>'}
 return h}

function vTarefas(c){var segs=[['atrasadas','Atrasadas'],['hoje','Hoje'],['concluidas','Concluídas'],['todas','Todas']];
 var opts=Object.keys(CATS).map(function(k){return '<option>'+k+'</option>'}).join('');
 var list=filt(c);
 return '<h1>Tarefas</h1><p class="sub">Nada é reagendado automaticamente.</p>'
 +'<div class="card"><input id="ti" placeholder="Nova tarefa" maxlength="120"><select id="tc">'+opts+'</select><input id="td" type="date" aria-label="Prazo"><select id="tp"><option value="normal">Prioridade normal</option><option value="alta">Prioridade alta</option></select><button class="btn" data-a="add">Adicionar tarefa</button></div>'
 +'<div class="seg">'+segs.map(function(s){return '<button data-a="view" data-v="'+s[0]+'" class="'+(view==s[0]?'on':'')+'">'+s[1]+'</button>'}).join('')+'</div>'
 +'<div class="card">'+(list.length?list.map(function(t){return taskHTML(t,c)}).join(''):'<div class="mut">Nenhuma tarefa nesta visão.</div>')+'</div>'}

function vCerebro(c){var cnt={},total=0;Object.keys(CATS).forEach(function(k){cnt[k]=0});
 tasks.forEach(function(t){if(cnt[t.cat]!==undefined){cnt[t.cat]++;total++}});
 var keys=Object.keys(CATS),s='<svg viewBox="0 0 360 340" width="100%" role="img" aria-label="Mapa de categorias">';
 for(var i=0;i<70;i++){var x=(i*97)%360,y=(i*61+i*i*7)%340;s+='<circle cx="'+x+'" cy="'+y+'" r="'+(i%5?0.7:1.2)+'" fill="#fff" opacity="'+(0.25+(i%4)*0.12)+'"/>'}
 keys.forEach(function(k,i){var a=i/keys.length*Math.PI*2-Math.PI/2,x=180+120*Math.cos(a),y=170+125*Math.sin(a),r=7+Math.min(24,cnt[k]*3);
  s+='<g data-a="cat" data-k="'+k+'" style="cursor:pointer"><circle cx="'+x+'" cy="'+y+'" r="'+(r+5)+'" fill="'+CATS[k]+'" opacity="'+(selCat==k?.28:.1)+'"/><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+CATS[k]+'" opacity="'+(cnt[k]?1:.4)+'"/><text x="'+x+'" y="'+(y+r+14)+'" text-anchor="middle">'+k+' ('+cnt[k]+')</text></g>'});
 s+='</svg>';
 var sel=selCat?tasks.filter(function(t){return t.cat==selCat}):[];
 return '<h1>Cérebro</h1><p class="sub">O tamanho de cada ponto é a quantidade de registros da categoria. Toque para ver o conteúdo.</p>'
 +'<div class="card">'+s+(total?'':'<div class="mut">Ainda sem dados: adicione tarefas para ver o mapa crescer. Conexões entre assuntos só aparecerão quando o Obsidian estiver integrado.</div>')+'</div>'
 +(selCat?'<div class="card"><h2>'+selCat+'</h2>'+(sel.length?sel.map(function(t){return taskHTML(t,c)}).join(''):'<div class="mut">Sem registros nesta categoria.</div>')+'</div>':'')}

function vProjeto(){var L=[['Dashboard e navegação','impl'],['Rotina fixa e agenda semanal','impl'],['Tarefas: atrasadas, hoje, concluídas, todas','impl'],['Cérebro com dados reais das tarefas','impl'],
 ['Leitura das notas do cofre (GitHub)','impl'],['Caixa de Entrada: gravar nota no cofre','impl'],['Classificação da Caixa de Entrada','impl'],['Conexões manuais entre notas','impl'],['Sugestões locais de notas relacionadas','impl'],['Chat com IA','plan'],['Diário às 22h','plan'],['Notificações push','plan'],['Objetivos e relatórios','plan'],['Clima de Belo Horizonte','plan']];
 return '<h1>Projeto</h1><p class="sub">Estado real de cada funcionalidade. Nada consta como testado: os testes no seu iPhone ainda não foram feitos.</p>'
 +'<div class="card">'+L.map(function(x){return '<div class="st"><span>'+x[0]+'</span><span class="tag '+x[1]+'">'+(x[1]=='impl'?'Implementado':'Planejado')+'</span></div>'}).join('')+'</div>'
 +'<div class="card mut">As tarefas e o token ficam apenas neste aparelho. As tarefas ainda não têm sincronização nem backup.</div>'}

function loadCfg(){try{var r=localStorage.getItem('cj_cfg');if(r)cfg=Object.assign(cfg,JSON.parse(r))}catch(e){}}
function saveCfg(){try{localStorage.setItem('cj_cfg',JSON.stringify(cfg))}catch(e){}}
function gh(path,raw){return fetch('https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+path,{headers:{'Authorization':'Bearer '+cfg.token,'Accept':raw?'application/vnd.github.raw+json':'application/vnd.github+json'}})}
function errMsg(r){return r.status==401?'Token inválido ou expirado.':r.status==403?'Acesso negado ou limite de requisições atingido.':r.status==404?'Repositório não encontrado. Confira usuário, nome do repositório e permissões do token.':'Erro '+r.status+' ao consultar o GitHub.'}
function httpErr(r){var e=new Error(errMsg(r));e.status=r.status;return e}
function diag(){var t='Repositório não encontrado. Tentei acessar '+cfg.owner+'/'+cfg.repo+'. ';
 return fetch('https://api.github.com/user/repos?per_page=100',{headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'}}).then(function(r){if(!r.ok)throw httpErr(r);return r.json()}).then(function(l){
  vmsg=t+(l.length?'O token enxerga: '+l.map(function(x){return x.full_name}).join(', ')+'.':'O token não enxerga nenhum repositório. Confira “Repository access” no token.')}).catch(function(e){vmsg=t+'Diagnóstico adicional: '+fail(e)})}
function fail(e){return e&&e.name=='TypeError'?'Sem conexão com o GitHub.':(e&&e.message)||'Falha desconhecida.'}
function noteTitle(path){
 if(noteTitles[path])return noteTitles[path];
 var base=path.split('/').pop().replace(/\.md$/i,'').replace(/^\d{4}-\d{2}-\d{2}[-_]?\d{0,6}[-_ ]*/,'').replace(/[_-]+/g,' ').replace(/^#+\s*/,'').trim();
 return base||'Nota sem título';
}
function titleFromNote(path,text){
 var body=String(text||'').replace(/^---\r?\n[\s\S]*?\r?\n---\s*/,'');
 var title=(String(text||'').match(/^(?:titulo|title)\s*:\s*["']?(.+?)["']?\s*$/mi)||[])[1];
 if(!title)title=(body.match(/^\s{0,3}#{1,6}\s+(.+?)\s*#*\s*$/m)||[])[1];
 if(!title)title=body.split(/\r?\n/).map(function(x){return x.trim()}).filter(Boolean)[0]||'';
 title=String(title).replace(/^#{1,6}\s*/,'').replace(/^[-*>]+\s*/,'').replace(/\*\*/g,'').replace(/`/g,'').replace(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g,'$1').trim();
 if(/^\d{4}-\d{2}-\d{2}/.test(title)||!title)return noteTitle(path);
 return title.length>76?title.slice(0,73).trim()+'…':title;
}
function noteFolder(path){var parts=path.split('/');return parts.length>1?parts.slice(0,-1).join(' / '):'Cofre pessoal'}
function loadNoteTitles(paths){
 var pending=paths.filter(function(path){return !noteTitles[path]}),index=0;
 function batch(){var group=pending.slice(index,index+5);index+=5;if(!group.length)return Promise.resolve();
  return Promise.all(group.map(function(path){return gh('/contents/'+path.split('/').map(encodeURIComponent).join('/')+'?ref=main',true).then(function(r){if(!r.ok)throw httpErr(r);return r.text()}).then(function(t){noteTitles[path]=titleFromNote(path,t)}).catch(function(){noteTitles[path]=noteTitle(path)})})).then(batch)
 }
 return batch();
}
function inlineNoteText(value){return esc(value).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,function(_,target,label){return label||target});}
function prettyNoteContent(text){
 var body=String(text||'').replace(/^---\r?\n[\s\S]*?\r?\n---\s*/,'').trim();
 if(!body)return '<p class="mut">Esta nota está vazia.</p>';
 return body.split(/\r?\n/).map(function(line){var t=line.trim();if(!t)return '';
  var head=t.match(/^(#{1,6})\s+(.+?)\s*#*$/);if(head)return '<h3 class="note-heading">'+inlineNoteText(head[2])+'</h3>';
  var bullet=t.match(/^[-*+]\s+(.+)$/);if(bullet)return '<p>• '+inlineNoteText(bullet[1])+'</p>';
  return '<p>'+inlineNoteText(t)+'</p>';
 }).join('');
}
function fetchNotes(){vmsg='';loading=true;render();
 return gh('/git/trees/main?recursive=1').then(function(r){if(!r.ok)throw httpErr(r);return r.json()}).then(function(j){
  notes=j.tree.filter(function(x){return x.type=='blob'&&/\.md$/i.test(x.path)&&x.path.charAt(0)!='.'}).map(function(x){return x.path}).sort();
  vmsg=j.truncated?'Lista parcial: o repositório é grande demais para esta consulta.':'';return loadNoteTitles(notes)}).catch(function(e){notes=null;vmsg=fail(e);if(e&&e.status==404)return diag()}).then(function(){loading=false;render()})}
function openN(p){noteView={path:p,text:'Carregando…'};classifyChoice='';classifyReview=false;classifyMsg='';relatedSelection=[];relatedReview=false;relatedMsg='';suggestedRelated=[];suggestBusy=false;render();
 return gh('/contents/'+p.split('/').map(encodeURIComponent).join('/')+'?ref=main',true).then(function(r){if(!r.ok)throw httpErr(r);return r.text()}).then(function(t){noteView.text=t||'(nota vazia)'}).catch(function(e){noteView.text=fail(e)}).then(render)}
function b64(t){return btoa(unescape(encodeURIComponent(t)))}
function decodeB64(t){return decodeURIComponent(escape(atob(String(t||'').replace(/\s/g,''))))}
function classifiedText(original,category){
 var m=original.match(/^---\r?\n([\s\S]*?)\r?\n---(\r?\n|$)/);
 if(!m)return '---\nstatus: classificado\ncategoria: "'+category+'"\n---\n\n'+original;
 var lines=m[1].split(/\r?\n/),hasStatus=false,hasCat=false;
 lines=lines.map(function(line){
  if(/^status\s*:/.test(line)){hasStatus=true;return 'status: classificado'}
  if(/^categoria\s*:/.test(line)){hasCat=true;return 'categoria: "'+category+'"'}
  return line
 });
 if(!hasStatus)lines.push('status: classificado');
 if(!hasCat)lines.push('categoria: "'+category+'"');
 return '---\n'+lines.join('\n')+'\n---'+m[2]+original.slice(m[0].length);
}
function classifyNote(){
 if(!noteView||!classifyChoice||classifyBusy)return;
 var path=noteView.path,category=classifyChoice,apiPath='/contents/'+path.split('/').map(encodeURIComponent).join('/')+'?ref=main';
 classifyBusy=true;classifyMsg='Salvando classificação…';render();
 return gh(apiPath,false).then(function(r){if(!r.ok)throw httpErr(r);return r.json()}).then(function(j){
  if(!j.sha||!j.content)throw new Error('Não foi possível obter a versão atual da nota. Nenhuma alteração foi feita.');
  var updated=classifiedText(decodeB64(j.content),category);
  return fetch('https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),{
   method:'PUT',headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
   body:JSON.stringify({message:'Classificar nota da Caixa de Entrada: '+category,content:b64(updated),sha:j.sha,branch:'main'})
  }).then(function(r){if(!r.ok)throw httpErr(r);return r.json()}).then(function(){noteView.text=updated;classifyChoice='';classifyReview=false;classifyMsg='Classificação salva no cofre. O conteúdo original foi preservado.'})
 }).catch(function(e){classifyMsg='Não foi possível classificar: '+fail(e)+' Nenhum conteúdo foi descartado.'})
 .then(function(){classifyBusy=false;render()})
}
function noteLink(path){return '[['+path.replace(/\\/g,'/').replace(/\.md$/i,'')+']]'}
function noteTerms(text,path){
 var stop=('sobre entre para pela pelo pelos pelas uma umas uns com sem mais muito muita muitos muitas que quem como onde quando porque por enquanto então também isso essa esse estas estes aquele aquela seus suas dele dela dos das nos nas aos às não sim ser ter foi são está estão estava estavam ter fazer fez pode podem deve devem meu minha meus minhas seu sua seus suas eu você voces nós eles elas ele ela ao de da do em no na os as um e ou se já ainda até após antes cada todo toda todos todas aqui ali lá hoje ontem amanhã ideia ideias tarefa tarefas lembrete lembretes compromisso compromissos nota notas registro registros').split(/\s+/);
 var words=(String(path||'').replace(/\.md$/i,'')+' '+String(text||'').replace(/^---[\s\S]*?---/,' ')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/[a-z0-9]{4,}/g)||[];
 var out={};words.forEach(function(w){if(stop.indexOf(w)<0)out[w]=(out[w]||0)+1});return out;
}
function similarity(a,b){var common=0,weight=0,na=0,nb=0;Object.keys(a).forEach(function(k){na+=a[k];if(b[k]){common++;weight+=Math.min(a[k],b[k])}});Object.keys(b).forEach(function(k){nb+=b[k]});return {score:common/Math.sqrt(Math.max(1,Object.keys(a).length*Object.keys(b).length)),common:common,weight:weight};}
function analyzeRelated(){
 if(!noteView||!notes||suggestBusy)return;
 suggestBusy=true;relatedMsg='Analisando o conteúdo das notas…';suggestedRelated=[];render();
 var current=noteTerms(noteView.text,noteView.path),existing=(noteView.text.match(/\[\[([^\]]+)\]\]/g)||[]).map(function(x){return x.slice(2,-2).replace(/\.md$/i,'')});
 var candidates=notes.filter(function(n){return n!==noteView.path&&existing.indexOf(n.replace(/\.md$/i,''))<0});
 var results=[],index=0;
 function batch(){var group=candidates.slice(index,index+5);index+=5;if(!group.length)return Promise.resolve();
  return Promise.all(group.map(function(path){return gh('/contents/'+path.split('/').map(encodeURIComponent).join('/')+'?ref=main',false).then(function(r){if(!r.ok)throw httpErr(r);return r.json()}).then(function(j){if(!j.content)return null;var sim=similarity(current,noteTerms(decodeB64(j.content),path));if(sim.common>=2&&sim.score>=0.16)return {path:path,score:sim.score,common:sim.common};return null}).catch(function(){return null})})).then(function(items){items.forEach(function(x){if(x)results.push(x)});return batch()})
 }
 return batch().then(function(){results.sort(function(a,b){return b.score-a.score});suggestedRelated=results.slice(0,8);relatedMsg=suggestedRelated.length?'Análise concluída. Confira as sugestões antes de selecionar.':'Não encontrei relações fortes o suficiente nas notas disponíveis.'}).catch(function(e){relatedMsg='Não foi possível analisar as notas: '+fail(e)}).then(function(){suggestBusy=false;render()});
}
function addRelatedLinks(original,paths){
 var links=paths.map(noteLink),text=original;
 var re=/(^|\n)(#{1,6})\s+Notas relacionadas\s*\n([\s\S]*?)(?=\n#{1,6}\s+|$)/i,m=text.match(re);
 if(m){
  var block=m[3],added=[];
  links.forEach(function(link){if(block.indexOf(link)===-1&&text.indexOf(link)===-1)added.push('- '+link)});
  if(!added.length)return text;
  var replacement=m[1]+m[2]+' Notas relacionadas\n'+block.replace(/\s*$/,'')+'\n'+added.join('\n');
  return text.replace(re,replacement);
 }
 var missing=links.filter(function(link){return text.indexOf(link)===-1});
 if(!missing.length)return text;
 return text.replace(/\s*$/,'')+'\n\n## Notas relacionadas\n'+missing.map(function(x){return '- '+x}).join('\n')+'\n';
}
function saveRelated(){
 if(!noteView||!relatedSelection.length||relatedBusy)return;
 var path=noteView.path,selected=relatedSelection.slice(),apiPath='/contents/'+path.split('/').map(encodeURIComponent).join('/')+'?ref=main';
 relatedBusy=true;relatedMsg='Salvando conexões…';render();
 return gh(apiPath,false).then(function(r){if(!r.ok)throw httpErr(r);return r.json()}).then(function(j){
  if(!j.sha||!j.content)throw new Error('Não foi possível obter a versão atual da nota. Nenhuma alteração foi feita.');
  var original=decodeB64(j.content),updated=addRelatedLinks(original,selected);
  if(updated===original)throw new Error('As notas selecionadas já estavam vinculadas. Nenhuma alteração foi necessária.');
  return fetch('https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),{
   method:'PUT',headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
   body:JSON.stringify({message:'Conectar notas relacionadas no Obsidian',content:b64(updated),sha:j.sha,branch:'main'})
  }).then(function(r){if(!r.ok)throw httpErr(r);return r.json()}).then(function(){noteView.text=updated;relatedSelection=[];relatedReview=false;relatedMsg='Conexões salvas no cofre. Os links Obsidian foram adicionados.'});
 }).catch(function(e){relatedMsg='Não foi possível conectar as notas: '+fail(e)}).then(function(){relatedBusy=false;render()});
}
function saveNote(){var text=draft.trim();if(!text)return;var d=new Date(),iso=isoOf(d),hms=fmt({hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'},d).split(':'),path='Caixa de Entrada/'+iso+'-'+hms.join('')+'.md';
 var body='---\ncriado: '+iso+'T'+hms.join(':')+'-03:00\norigem: app CENTRAL JARVIS\nstatus: não classificado\n---\n\n'+text+'\n';
 wmsg='Gravando…';render();
 return fetch('https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),{method:'PUT',headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Caixa de Entrada: nova nota (app)',content:b64(body),branch:'main'})}).then(function(r){
  if(r.ok){draft='';review=false;wmsg='Nota gravada em '+path+'.';notes=null;return fetchNotes()}
  review=false;wmsg=(r.status==403||r.status==404)?'Sem permissão de escrita. Gere um token com “Contents: Read and write” e reconecte. Seu texto foi mantido.':r.status==401?'Token inválido ou expirado. Seu texto foi mantido.':r.status==422?'Já existe uma nota com esse nome. Tente novamente. Seu texto foi mantido.':'Erro '+r.status+' ao gravar. Seu texto foi mantido.'}).catch(function(e){review=false;wmsg=fail(e)+' Seu texto foi mantido.'}).then(render)}
function vCofre(){var h='<h1>Cofre</h1><p class="sub">Notas do repositório privado e Caixa de Entrada.</p>';
 if(!cfg.token)return h+'<div class="card"><h2>Conectar</h2><input id="co" value="'+esc(cfg.owner)+'" placeholder="Usuário do GitHub" autocapitalize="none" autocorrect="off"><input id="cr" value="'+esc(cfg.repo)+'" placeholder="Repositório" autocapitalize="none" autocorrect="off"><input id="ct" name="chave-jarvis" type="text" placeholder="Token (cole aqui)" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"><button class="btn" data-a="conn">Conectar</button><p class="mut">O token fica salvo apenas neste aparelho. Use um token restrito a este repositório. Para gravar notas, ele precisa da permissão Contents: Read and write.</p></div>';
 if(noteView){
  var isInbox=noteView.path.indexOf('Caixa de Entrada/')===0;
  var status=(noteView.text.match(/^status\s*:\s*(.+)$/mi)||[])[1]||'';
  var category=(noteView.text.match(/^categoria\s*:\s*"?([^"\r\n]+)"?\s*$/mi)||[])[1]||'';
  var alreadyClassified=/classificado/i.test(status)&&!/não\s+classificado/i.test(status);
  h+='<div class="card"><button class="del" data-a="back">‹ Voltar</button><div class="note-heading" style="font-size:1.25rem;margin-top:8px">'+esc(noteTitle(noteView.path))+'</div><div class="note-sub">'+esc(noteFolder(noteView.path))+'</div>';
  if(isInbox&&noteView.text!=='Carregando…'){
   if(alreadyClassified)h+='<div class="aviso">Classificada'+(category?' · '+esc(category):'')+'.</div>';
   else if(classifyReview)h+='<div class="aviso">A nota será classificada como <b>'+esc(classifyChoice)+'</b>. O texto original será mantido; apenas os campos de classificação serão acrescentados ou atualizados.</div><div class="two"><button class="btn" data-a="classifyConfirm" '+(classifyBusy?'disabled':'')+'>Confirmar classificação</button><button class="btn alt" data-a="classifyCancel">Voltar</button></div>';
   else h+='<h2>Classificar nota</h2><p class="mut">Escolha uma categoria. Nada será alterado até sua confirmação.</p><select id="classifyCat"><option value="">Selecione uma categoria</option><option>Tarefa</option><option>Ideia</option><option>Compromisso</option><option>Lembrete</option></select><button class="btn" data-a="classifyReview">Revisar classificação</button>';
   if(classifyMsg)h+='<div class="aviso">'+esc(classifyMsg)+'</div>';
  }
  if(noteView.text!=='Carregando…'){
   var relatedOptions=(notes||[]).filter(function(n){return n!==noteView.path});
   h+='<div class="card"><h2>Notas relacionadas</h2><p class="mut">O JARVIS pode comparar o conteúdo das notas e sugerir relações. A análise é local, por palavras-chave; nada é gravado sem sua confirmação.</p>';
   h+='<button class="btn alt" data-a="analyzeRelated" '+(suggestBusy?'disabled':'')+'>'+(suggestBusy?'Analisando…':'Analisar notas e sugerir relações')+'</button>';
   if(suggestedRelated.length&&!relatedReview){h+='<div class="aviso">Sugestões encontradas. Marque as que fazem sentido:</div>';suggestedRelated.forEach(function(x){h+='<label class="note-check"><input type="checkbox" data-rel-select="1" data-p="'+esc(x.path)+'" '+(relatedSelection.indexOf(x.path)>=0?'checked':'')+'><span class="note-info"><b class="note-title">'+esc(noteTitle(x.path))+'</b><small class="note-sub">'+esc(noteFolder(x.path))+' · '+x.common+' termos em comum</small></span></label>'})}
   if(relatedReview){
    h+='<div class="aviso">Serão adicionados à nota os seguintes vínculos:</div><ul>';
    relatedSelection.forEach(function(n){h+='<li class="note-item"><span class="note-icon">↗</span><span class="note-info"><b class="note-title">'+esc(noteTitle(n))+'</b><small class="note-sub">'+esc(noteFolder(n))+'</small></span></li>'});
    h+='</ul><div class="two"><button class="btn" data-a="relatedConfirm" '+(relatedBusy?'disabled':'')+'>Confirmar conexões</button><button class="btn alt" data-a="relatedCancel">Voltar</button></div>';
   }else if(!relatedOptions.length){
    h+='<div class="mut">Nenhuma outra nota disponível. Atualize a lista do cofre para buscar notas.</div>';
   }else{
    h+='<div style="max-height:260px;overflow:auto">';
    relatedOptions.forEach(function(n){h+='<label class="note-check"><input type="checkbox" data-rel-select="1" data-p="'+esc(n)+'" '+(relatedSelection.indexOf(n)>=0?'checked':'')+'><span class="note-info"><b class="note-title">'+esc(noteTitle(n))+'</b><small class="note-sub">'+esc(noteFolder(n))+'</small></span></label>'});
    h+='</div><button class="btn" data-a="relatedReview" '+(!relatedSelection.length?'disabled':'')+'>Revisar conexões ('+relatedSelection.length+')</button>';
   }
   if(relatedMsg)h+='<div class="aviso">'+esc(relatedMsg)+'</div>';
   h+='</div>';
  }
  h+='<div class="note-section"><h2>Conteúdo da nota</h2><div class="note-content">'+prettyNoteContent(noteView.text)+'</div></div></div>';
  return h
 }
 h+='<div class="two"><button class="btn" data-a="sync">Atualizar</button><button class="btn alt" data-a="disc">Desconectar</button></div>';
 h+='<div class="card"><h2>Caixa de Entrada</h2>'+(review?'<div class="mut">Confirme o conteúdo que será gravado como nova nota no repositório:</div><pre>'+esc(draft)+'</pre><div class="two" style="margin-top:12px"><button class="btn" data-a="save">Confirmar e gravar</button><button class="btn alt" data-a="cancel">Voltar</button></div>':'<textarea id="nn" placeholder="Escreva uma ideia, um fato ou um registro…" rows="4">'+esc(draft)+'</textarea><button class="btn" data-a="rev">Revisar e gravar</button>')+(wmsg?'<div class="aviso">'+esc(wmsg)+'</div>':'')+'</div>';
 if(loading)h+='<div class="mut">Carregando…</div>';
 if(vmsg)h+='<div class="aviso">'+esc(vmsg)+'</div>';
 if(notes)h+='<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px"><h2 style="margin:0">Suas notas</h2><span class="tag impl">'+notes.length+'</span></div>'+(notes.length?'<div class="note-list">'+notes.map(function(n){return '<button class="note-item" data-a="note" data-p="'+esc(n)+'"><span class="note-icon">▤</span><span class="note-info"><b class="note-title">'+esc(noteTitle(n))+'</b><small class="note-sub">'+esc(noteFolder(n))+'</small></span><span class="note-arrow">›</span></button>'}).join('')+'</div>':'<div class="mut">Nenhuma nota encontrada.</div>')+'</div>';
 return h}
function render(){var c=clock(),h=tab=='inicio'?vInicio(c):tab=='agenda'?vAgenda(c):tab=='tarefas'?vTarefas(c):tab=='cerebro'?vCerebro(c):tab=='cofre'?vCofre():vProjeto();
 document.getElementById('app').innerHTML=h;
 var N=[['inicio','⌂','Início'],['agenda','▦','Agenda'],['tarefas','✓','Tarefas'],['cerebro','✦','Cérebro'],['cofre','▤','Cofre'],['projeto','≡','Projeto']];
 document.getElementById('nav').innerHTML=N.map(function(n){return '<button data-a="tab" data-t="'+n[0]+'" class="'+(tab==n[0]?'on':'')+'"><b>'+n[1]+'</b>'+n[2]+'</button>'}).join('')}

document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el)return;var a=el.getAttribute('data-a'),id=el.getAttribute('data-id');
 if(a=='tab'){tab=el.getAttribute('data-t');delId=null;window.scrollTo(0,0);if(tab=='cofre'&&cfg.token&&notes===null&&!loading)fetchNotes()}
 else if(a=='view'){view=el.getAttribute('data-v')}
 else if(a=='cat'){var k=el.getAttribute('data-k');selCat=selCat==k?null:k}
 else if(a=='add'){var t=document.getElementById('ti').value.trim();if(!t)return;
  tasks.push({id:String(Date.now()),title:t,cat:document.getElementById('tc').value,due:document.getElementById('td').value||'',prio:document.getElementById('tp').value,done:false});save()}
 else if(a=='tog'){tasks.forEach(function(t){if(t.id==id)t.done=!t.done});save()}
 else if(a=='del'){if(delId===id){tasks=tasks.filter(function(t){return t.id!=id});delId=null;save()}else delId=id}
 else if(a=='conn'){var t=document.getElementById('ct').value.trim();if(!t)return;cfg={owner:document.getElementById('co').value.trim(),repo:document.getElementById('cr').value.trim(),token:t};saveCfg();notes=null;fetchNotes()}
 else if(a=='sync'){fetchNotes()}
 else if(a=='note'){openN(el.getAttribute('data-p'))}
 else if(a=='classifyReview'){
  var categorySelect=document.getElementById('classifyCat');
  classifyChoice=categorySelect?categorySelect.value:'';
  if(!classifyChoice){classifyMsg='Selecione uma categoria antes de continuar.';classifyReview=false}

 }
 else if(a=='classifyConfirm'){classifyNote()}
 else if(a=='classifyCancel'){classifyReview=false;classifyMsg=''}
 else if(a=='analyzeRelated'){analyzeRelated()}
 else if(a=='relatedReview'){relatedMsg='';if(relatedSelection.length)relatedReview=true}
 else if(a=='relatedConfirm'){saveRelated()}
 else if(a=='relatedCancel'){relatedReview=false;relatedMsg=''}
 else if(a=='back'){noteView=null;classifyReview=false;classifyMsg=''}
 else if(a=='disc'){cfg.token='';notes=null;noteView=null;vmsg='';wmsg='';classifyChoice='';classifyReview=false;classifyMsg='';saveCfg()}
 else if(a=='rev'){var ta=document.getElementById('nn');if(ta)draft=ta.value;if(!draft.trim())return;review=true;wmsg=''}
 else if(a=='cancel'){review=false}
 else if(a=='save'){saveNote()}
 render()});
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
document.addEventListener('input',function(e){if(e.target&&e.target.id=='nn')draft=e.target.value});

 if(e.target&&e.target.id=='classifyCat'){classifyChoice=e.target.value;classifyMsg=''}
 if(e.target&&e.target.getAttribute('data-rel-select')=='1'){

});
